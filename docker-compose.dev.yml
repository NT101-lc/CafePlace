# Development only:
#   - PostgreSQL for the backend (database "cms") and its tests (database "cms_test")
#   - RustFS (S3-compatible object storage) for menu item images (buckets "cms-media" and "cms-media-test")
# Start:  docker compose -f docker-compose.dev.yml up -d
# Stop:   docker compose -f docker-compose.dev.yml down        (add -v to also delete the data)
name: cms-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      # Runs only on the very first start (empty volume).
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/create-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: cms-dev
      RUSTFS_SECRET_KEY: cms-dev-secret
      # Web console: http://localhost:9101/rustfs/console/  (login with the keys above)
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      # Host ports 9100/9101 because 9000/9001 are often taken by MinIO.
      - "9100:9000"
      - "9101:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

configs:
  create-test-db:
    content: |
      CREATE DATABASE cms_test OWNER cms;

volumes:
  pgdata:
  rustfs-data:
