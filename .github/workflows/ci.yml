name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      # Same database the integration tests use locally (see application-test.yml).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cms_test
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d cms_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Same storage the image tests use locally (bucket "cms-media-test" is created by the app).
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ACCESS_KEY: cms-dev
          RUSTFS_SECRET_KEY: cms-dev-secret
        ports:
          - 9100:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build

  deploy-check:
    name: Deploy files (Docker images + compose + scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Validate production compose file
        run: docker compose -f deploy/docker-compose.yml --env-file .env.example config --quiet
      - name: Lint backup script
        run: shellcheck deploy/backup.sh
      - name: Build backend image
        run: docker build -t cms-app:ci backend
      - name: Build web (frontend + Caddy) image
        run: docker build -t cms-web:ci -f deploy/web.Dockerfile .
      - name: Validate Caddyfile
        run: docker run --rm -e DOMAIN=example.com cms-web:ci caddy validate --config /etc/caddy/Caddyfile
