# Local development. Defaults match docker-compose.dev.yml so no env vars are needed.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cms}
    username: ${DB_USERNAME:cms}
    password: ${DB_PASSWORD:cms}

app:
  jwt:
    # Dev-only secret. Never reuse it in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  storage:
    # Matches the rustfs service in docker-compose.dev.yml.
    endpoint: ${S3_ENDPOINT:http://localhost:9100}
    access-key: ${S3_ACCESS_KEY:cms-dev}
    secret-key: ${S3_SECRET_KEY:cms-dev-secret}

logging:
  level:
    # Print SQL so you can see the automatic "shop_id = ?" filter.
    org.hibernate.SQL: debug
