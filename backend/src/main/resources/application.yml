# Settings shared by all profiles. Environment-specific values live in application-{profile}.yml.
spring:
  application:
    name: cms-backend
  profiles:
    # Running without SPRING_PROFILES_ACTIVE (e.g. ./mvnw spring-boot:run) uses the dev profile.
    default: dev
  jpa:
    # Keep the DB session short: open per transaction, not per HTTP request.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    # Long-lived so the PWA keeps working offline. No refresh token yet.
    ttl: ${JWT_TTL:7d}
  storage:
    # S3-compatible object storage (RustFS) for uploaded images.
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET:cms-media}
  demo:
    # DEMO BRANCH ONLY: shared demo shop, testers enter without logging in (see com.cms.demo).
    # Set DEMO_MODE=false to turn it off.
    enabled: ${DEMO_MODE:true}
