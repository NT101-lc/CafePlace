# Integration tests run against a real PostgreSQL database "cms_test"
# (created by docker-compose.dev.yml locally, by the postgres service in CI).
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/cms_test}
    username: ${DB_USERNAME:cms}
    password: ${DB_PASSWORD:cms}

app:
  jwt:
    secret: test-only-secret-0123456789abcdef0123456789
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9100}
    access-key: ${S3_ACCESS_KEY:cms-dev}
    secret-key: ${S3_SECRET_KEY:cms-dev-secret}
    bucket: cms-media-test
